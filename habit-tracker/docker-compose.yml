version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: habit_postgres

    environment:
      POSTGRES_DB: habit_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: habit_backend

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: habit_frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app

volumes:
  postgres_data: